@if (product(); as p) {
  <button
    type="button"
    (click)="onClick()"
    class="product-card flex h-full flex-col rounded-xl border border-slate-200 bg-slate-100 p-4 text-left shadow-sm transition hover:border-rose-300 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-rose-600"
  >
    <div class="flex flex-1 flex-col">
      <div class="mb-3 flex flex-col items-start gap-1">
        <h3 class="line-clamp-1 font-medium text-slate-800">
          {{ p.title }}
        </h3>
        <p class="text-lg font-semibold text-rose-700">
          ${{ p.price }}
        </p>
      </div>
      <div class="aspect-square w-full overflow-hidden rounded-lg">
        <img
          [src]="p.image"
          [alt]="p.title"
          class="h-full w-full object-contain"
        />
      </div>
    </div>
    <div class="mt-3 flex flex-col items-center justify-center gap-1">
      <div class="flex items-center gap-1.5 text-slate-700">
        <i class="pi pi-star-fill text-amber-500"></i>
        <span class="font-medium">{{ p.rating.rate }}</span>
      </div>
      <span class="text-xs text-slate-500">{{ p.rating.count }} reviews</span>
    </div>
  </button>
}
