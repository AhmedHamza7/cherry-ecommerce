<div class="space-y-4">
  @if (store.loading()) {
    <div class="flex items-center justify-center py-16">
      <i class="pi pi-spin pi-spinner text-4xl text-rose-500"></i>
    </div>
  } @else {
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
      @for (product of store.filteredProducts(); track product.id) {
        <button
          type="button"
          (click)="selectProduct(product.id)"
          class="flex flex-col rounded-xl border border-slate-200 bg-white p-4 text-left shadow-sm transition hover:border-rose-200 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-rose-500"
        >
          <div class="aspect-square w-full overflow-hidden rounded-lg bg-slate-100">
            <img
              [src]="product.image"
              [alt]="product.title"
              class="h-full w-full object-contain"
            />
          </div>
          <h3 class="mt-3 line-clamp-2 font-medium text-slate-800">
            {{ product.title }}
          </h3>
          <p class="mt-1 text-lg font-semibold text-rose-600">
            ${{ product.price }}
          </p>
          <p class="mt-1 text-sm text-slate-500">{{ product.category }}</p>
        </button>
      }
    </div>
    @if (store.filteredProducts().length === 0) {
      <p class="py-8 text-center text-slate-500">No products match the filters.</p>
    }
  }
</div>
