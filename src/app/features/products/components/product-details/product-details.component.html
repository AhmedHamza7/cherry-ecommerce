@if (store.selectedProduct(); as product) {
  <div class="flex flex-col gap-4">
    <div class="aspect-square w-full overflow-hidden rounded-lg bg-slate-100">
      <img
        [src]="product.image"
        [alt]="product.title"
        class="h-full w-full object-contain"
      />
    </div>
    <div>
      <p class="text-2xl font-semibold text-rose-600">\${{ product.price }}</p>
      <p class="mt-2 text-sm uppercase tracking-wide text-slate-500">
        {{ product.category }}
      </p>
    </div>
    <p class="text-slate-700">{{ product.description }}</p>
    <div class="flex items-center gap-2 text-sm text-slate-600">
      <i class="pi pi-star-fill text-amber-400"></i>
      <span>{{ product.rating.rate }}</span>
      <span class="text-slate-400">({{ product.rating.count }} reviews)</span>
    </div>
  </div>
}
