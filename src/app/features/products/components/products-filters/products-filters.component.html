<div class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
  <!-- Category -->
  <h2 class="mb-3 font-semibold text-slate-800">Category</h2>
  <div class="flex flex-col gap-1">
    <button
      type="button"
      (click)="setCategory(null)"
      class="rounded-lg px-3 py-2 text-left text-sm transition"
      [class.bg-rose-100]="!store.selectedCategory()"
      [class.text-rose-700]="!store.selectedCategory()"
      [class.text-slate-600]="store.selectedCategory()"
      [class.hover:bg-slate-100]="store.selectedCategory()"
    >
      All
    </button>
    @for (cat of store.categories(); track cat) {
      <button
        type="button"
        (click)="setCategory(cat)"
        class="rounded-lg px-3 py-2 text-left text-sm capitalize transition"
        [class.bg-rose-100]="store.selectedCategory() === cat"
        [class.text-rose-700]="store.selectedCategory() === cat"
        [class.text-slate-600]="store.selectedCategory() !== cat"
        [class.hover:bg-slate-100]="store.selectedCategory() !== cat"
      >
        {{ cat }}
      </button>
    }
  </div>

  <!-- Price -->
  <hr class="my-4 border-slate-200" />
  <h2 class="mb-2 font-semibold text-slate-800">Price</h2>
  <div class="flex gap-2">
    <input
      #minPrice
      type="number"
      placeholder="Min"
      class="w-1/2 rounded-lg border border-slate-200 px-3 py-2 text-sm focus:border-rose-500 focus:outline-none focus:ring-1 focus:ring-rose-500"
      (input)="onPriceChange(minPrice.value, maxPrice.value)"
    />
    <input
      #maxPrice
      type="number"
      placeholder="Max"
      class="w-1/2 rounded-lg border border-slate-200 px-3 py-2 text-sm focus:border-rose-500 focus:outline-none focus:ring-1 focus:ring-rose-500"
      (input)="onPriceChange(minPrice.value, maxPrice.value)"
    />
  </div>

  <!-- Rating -->
  <h2 class="mt-4 mb-2 font-semibold text-slate-800">Rating</h2>
  <div class="flex flex-col gap-1">
    <button
      type="button"
      (click)="setMinRating(null)"
      class="rounded-lg px-3 py-2 text-left text-sm transition"
      [class.bg-rose-100]="!store.minRating()"
      [class.text-rose-700]="!store.minRating()"
      [class.text-slate-600]="store.minRating()"
      [class.hover:bg-slate-100]="store.minRating()"
    >
      Any rating
    </button>
    <button
      type="button"
      (click)="setMinRating(4)"
      class="rounded-lg px-3 py-2 text-left text-sm transition"
      [class.bg-rose-100]="store.minRating() === 4"
      [class.text-rose-700]="store.minRating() === 4"
      [class.text-slate-600]="store.minRating() !== 4"
      [class.hover:bg-slate-100]="store.minRating() !== 4"
    >
      4+ stars
    </button>
    <button
      type="button"
      (click)="setMinRating(3)"
      class="rounded-lg px-3 py-2 text-left text-sm transition"
      [class.bg-rose-100]="store.minRating() === 3"
      [class.text-rose-700]="store.minRating() === 3"
      [class.text-slate-600]="store.minRating() !== 3"
      [class.hover:bg-slate-100]="store.minRating() !== 3"
    >
      3+ stars
    </button>
    <button
      type="button"
      (click)="setMinRating(2)"
      class="rounded-lg px-3 py-2 text-left text-sm transition"
      [class.bg-rose-100]="store.minRating() === 2"
      [class.text-rose-700]="store.minRating() === 2"
      [class.text-slate-600]="store.minRating() !== 2"
      [class.hover:bg-slate-100]="store.minRating() !== 2"
    >
      2+ stars
    </button>
  </div>
</div>
