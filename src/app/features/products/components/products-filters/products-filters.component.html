<div class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
  <h2 class="mb-3 font-semibold text-slate-800">Category</h2>
  <div class="flex flex-col gap-1">
    <button
      type="button"
      (click)="setCategory(null)"
      class="rounded-lg px-3 py-2 text-left text-sm transition"
      [class.bg-rose-100]="!store.selectedCategory()"
      [class.text-rose-700]="!store.selectedCategory()"
      [class.text-slate-600]="store.selectedCategory()"
      [class.hover:bg-slate-100]="store.selectedCategory()"
    >
      All
    </button>
    @for (cat of store.categories(); track cat) {
      <button
        type="button"
        (click)="setCategory(cat)"
        class="rounded-lg px-3 py-2 text-left text-sm capitalize transition"
        [class.bg-rose-100]="store.selectedCategory() === cat"
        [class.text-rose-700]="store.selectedCategory() === cat"
        [class.text-slate-600]="store.selectedCategory() !== cat"
        [class.hover:bg-slate-100]="store.selectedCategory() !== cat"
      >
        {{ cat }}
      </button>
    }
  </div>
</div>
